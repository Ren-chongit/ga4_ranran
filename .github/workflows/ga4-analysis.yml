name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # リポジトリ読み込みなし（トークン節約の鉄則）

      # MCPサーバーの準備
      - name: Pre-install MCP server
        run: |
          npx -y mcp-server-google-analytics --version || echo "MCP server ready"
        continue-on-error: true
      
      # Geminiの実行
      - name: Run Gemini GA4 Summary via MCP (JS server)
        id: ga4
        uses: google-gemini/gemini-cli-action@main
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GEMINI_MODEL: gemini-2.5-flash
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          settings_json: |
            {
              "mcpServers": {
                "google-analytics": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-google-analytics"],
                  "env": {
                    "GOOGLE_CLIENT_EMAIL": "$GOOGLE_CLIENT_EMAIL",
                    "GOOGLE_PRIVATE_KEY": "$GOOGLE_PRIVATE_KEY",
                    "GA_PROPERTY_ID": "$GA_PROPERTY_ID"
                  }
                }
              },
              "coreTools": ["mcp__google-analytics__run_report"]
            }
          prompt: |
            あなたはプロのGA4データアナリストです。
            
            【超重要：APIエラー回避のための絶対ルール】
            1. **dimensionFilter（フィルタ機能）は絶対に使用禁止です。**
               - フィルタを使おうとするとAPIエラーになり、処理が停止します。
               - 特定のイベントが見たい場合でも、必ず「全イベント」を取得してから、あなたの頭脳で必要な行を探してください。
            2. データ取得は必ず `mcp__google-analytics__run_report` ツールを使用してください。
            
            【手順1：データの取得】
            以下のデータを、フィルタなしで広範囲に取得してください。
            
            1. **イベントデータ（今週）**
               - 期間：昨日から過去7日間
               - dimensions: ["eventName"]
               - metrics: ["eventCount"]
               - ※フィルタなしで全イベントを取得すること！
            
            2. **イベントデータ（前週）**
               - 期間：その前の7日間
               - dimensions: ["eventName"]
               - metrics: ["eventCount"]
               - ※フィルタなし！
            
            3. **流入元データ（今週）**
               - dimensions: ["sessionSource", "sessionMedium"]
               - metrics: ["sessions"]
            
            4. **ページデータ（今週）**
               - dimensions: ["pagePath"]
               - metrics: ["screenPageViews"]
            
            【手順2：計算と分析】
            取得した「全イベントリスト」の中から、以下のイベントを探して計算してください。
            - `booking_form_start` (予約フォーム開始)
            - `booking_complete` (予約完了)
            - もしイベント名が正確に一致しない場合は、似た名前（例: `form_start` や `purchase`）を探して代用し、その旨を報告してください。
            
            **コンバージョン率(CVR)の計算:**
            CVR = (予約完了数 ÷ 予約フォーム開始数) × 100
            
            【出力形式】
            前置き不要。以下のMarkdown形式で出力。
            
            ## トラフィック傾向 (期間: MM/DD - MM/DD)
            - **上位ソース**:
              * ソース1: XX [前週比]
              * ソース2: XX [前週比]
            - **考察**: (簡潔に)
            
            ## 人気ページ
            - **上位ページ**:
              * /url1: XX PV
              * /url2: XX PV
            
            ## コンバージョン分析
            - **予約フォーム開始**: XX件 (イベント名: xxxx)
            - **予約完了**: XX件 (イベント名: xxxx)
            - **CVR**: XX.X% (計算式: 完了÷開始)
            - **前週比**: CVR ±X.Xポイント
            - **考察と改善提案**:
              * (具体的なアクション案)
            
            ## まとめ
            - (一言で状況評価)
