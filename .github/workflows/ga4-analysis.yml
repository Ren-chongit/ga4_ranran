name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 3'  # 毎週水曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # MCPサーバーウォームアップ
      - name: Pre-install MCP server
        run: |
          npx -y mcp-server-google-analytics --version || echo "MCP server ready"
        continue-on-error: true
      
      - name: Run Gemini GA4 Summary via MCP (JS server)
        id: ga4
        uses: google-gemini/gemini-cli-action@main
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GEMINI_MODEL: gemini-2.0-flash
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          settings_json: |
            {
              "mcpServers": {
                "google-analytics": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-google-analytics"],
                  "env": {
                    "GOOGLE_CLIENT_EMAIL": "$GOOGLE_CLIENT_EMAIL",
                    "GOOGLE_PRIVATE_KEY": "$GOOGLE_PRIVATE_KEY",
                    "GA_PROPERTY_ID": "$GA_PROPERTY_ID"
                  }
                }
              },
              "coreTools": ["mcp__google-analytics__run_report"]
            }
          prompt: |
            あなたはGA4データアナリストです。
            
            【重要】mcp__google-analytics__run_report ツールを使用してGA4データを取得し、分析結果のみを簡潔にまとめてください。
            
            【禁止事項】
            - データ取得プロセスの説明は一切書かない
            - エラーの説明や試行錯誤の過程は書かない
            - 「計画を立てます」「次に実行します」などのプロセス記述は不要
            
            【必須】以下の3つのデータを取得：
            1. トラフィックソースデータ（昨日から過去7日間、タイムゾーン: Asia/Tokyo）
               - dimensions: ["sessionSource", "sessionMedium"]
               - metrics: ["sessions"]
               - 上位10件を降順で取得
            
            2. 人気ページデータ（同期間）
               - dimensions: ["pagePath"]
               - metrics: ["screenPageViews"]
               - 上位10件を降順で取得
            
            3. イベントデータ（同期間）
               - dimensions: ["eventName"]
               - metrics: ["eventCount"]
               - 全イベントを取得し、予約・購入関連イベントを特定
            
            【出力形式】取得したデータを元に、以下の形式で日本語で記載：
            
            ## トラフィック傾向
            - **上位3ソース**: 具体的な数値を含めて記載（例：google/organic 8,000セッション）
            - **考察**: 前週比や特徴的な傾向を分析
            - **改善提案**: 具体的なアクションプラン2-3件
            
            ## 人気ページ
            - **上位5ページ**: 具体的なPV数を含めて記載
            - **考察**: ユーザー行動の特徴を分析
            - **改善提案**: UI/UX改善の具体案2-3件
            
            ## コンバージョンと考察
            - **主要イベント**: 予約・購入関連イベントの件数を記載
            - **ファネル分析**: 各ステップの離脱率を推定
            - **改善提案**: コンバージョン率向上の具体案2-3件
            
            ## 今後の施策（優先度順）
            1. 最優先施策
            2. 重要施策
            3. 継続施策
            
            ※数値は必ず含めること。推測や一般論ではなく、取得したデータに基づいて記載すること。
      
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            // 日本時間を考慮（UTCから9時間進める）
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            
            const yesterday = new Date(jstToday);
            yesterday.setDate(yesterday.getDate() - 1);
            
            const sevenDaysAgo = new Date(jstToday);
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            // MM-DD形式に整形
            const fmt = (d) => d.toISOString().split('T')[0].slice(5); // "2025-10-22" → "10-22"
            const todayFull = jstToday.toISOString().split('T')[0]; // 実行日は西暦あり
            const title = `(${todayFull}) らんらんアクセス解析｜期間：${fmt(sevenDaysAgo)}〜${fmt(yesterday)}`;
            
            const outs = ${{ toJSON(steps.ga4.outputs) }};
            const pick = (keys) => { 
              for (const k of keys){ 
                const v=(outs?.[k]||'').trim(); 
                if(v) return v; 
              } 
              return ''; 
            };
            const body = pick(['gemini_result','gemini_response','summary','output','text','content'])
              || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
