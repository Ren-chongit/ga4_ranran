name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. 読み込み回避

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Gemini CLI グローバルインストール
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業ディレクトリ作成
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore

      # 5. 設定ファイル作成
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. プロンプト作成（安全かつリッチ版）
      # 都市(City)は除外、ソース/メディアとデバイス比率は維持。
      - name: Create Prompt File
        run: |
          TODAY=$(date +%Y-%m-%d)
          START_THIS=$(date -d "7 days ago" +%Y-%m-%d)
          END_THIS=$(date -d "1 day ago" +%Y-%m-%d)
          START_LAST=$(date -d "14 days ago" +%Y-%m-%d)
          END_LAST=$(date -d "8 days ago" +%Y-%m-%d)

          cat <<EOF > work_dir/prompt.txt
          あなたは熟練のWebマーケティングコンサルタントです。
          以下のデータに基づき、**具体的でインサイトのある週次レポート**を作成してください。

          【分析対象期間】
          - 今週: $START_THIS から $END_THIS
          - 前週: $START_LAST から $END_LAST

          【指示：データ取得】
          mcp__google-analytics__run_report を使い、「今週」と「前週」のデータを取得してください。
          
          **取得する指標（以下の3つをそれぞれ個別に取得すること）:**
          
          1. **詳細な流入元トラフィック**
             - dimensions: ["sessionSource", "sessionMedium"]
             - metrics: ["sessions"]
             - ※「google / cpc」や「yahoo / organic」ごとの増減を見ます。
          
          2. **デバイス別利用状況**
             - dimensions: ["deviceCategory"]
             - metrics: ["sessions"]
             - ※スマホ(mobile)とPC(desktop)の比率を見ます。
          
          3. **イベント・コンバージョン**
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]

          【指示：分析と計算】
          1. **前週比**: 
             - 主要な数値について (今週-前週)÷前週×100 で増減率を算出。「+XX%」「-XX%」と明記。
          
          2. **CVRとファネル**:
             - 予約開始: "booking_form_start"
             - 予約完了: "booking_complete"
             - CVR = (完了数 ÷ 開始数) × 100

          【出力フォーマット】
          Markdown形式で出力してください。

          ***
          # 📈 週次アクセス解析レポート ($START_THIS 〜 $END_THIS)
          
          ## 1. コンバージョン成果 (最重要)
          - **全体CVR**: **[XX.X%]** (前週比: ±XXpt)
          - **予約フォーム開始**: [XX件] (前週比: ±XX%)
          - **予約完了**: [XX件] (前週比: ±XX%)
          - **考察**: (CVRの変化要因について)
          
          ## 2. 流入元詳細 (Top Sources)
          - **トップ流入元**:
            * [ソース/メディア]: [セッション数] (前週比: ±XX%)
            * ...
          - **考察**: (広告効果や検索流入の変化について)
          
          ## 3. デバイス比率
          - **構成比**: Mobile [XX%] / Desktop [XX%] / Tablet [XX%]
          - **考察**: (デバイスごとの特徴があれば)
          
          ## 4. 今後のアクション
          - **課題**:
          - **具体的施策**:
          ***
          EOF

      # 7. Geminiの実行
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          gemini -m gemini-1.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          DELIMITER=$(uuidgen)
          echo "GEMINI_RESPONSE<<$DELIMITER" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "$DELIMITER" >> $GITHUB_ENV

      # 8. Issueの作成
      # 【修正】タイトルを「(日付) らんらんアクセス解析｜期間：MM-DD〜MM-DD」に戻しました
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            
            const yesterday = new Date(jstToday);
            yesterday.setDate(yesterday.getDate() - 1);
            
            const sevenDaysAgo = new Date(jstToday);
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            const fmt = (d) => d.toISOString().split('T')[0].slice(5);
            const todayFull = jstToday.toISOString().split('T')[0];
            
            // ここでタイトルを指定の形式に戻しました
            const title = `(${todayFull}) らんらんアクセス解析｜期間：${fmt(sevenDaysAgo)}〜${fmt(yesterday)}`;
            
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
