name: Gemini GA4 Summary

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 3'  # 毎週水曜 日本時間09:00（UTC 00:00）

permissions:
  contents: read
  issues: write

jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fix GOOGLE_PRIVATE_KEY format
        run: |
          echo "${{ secrets.GOOGLE_PRIVATE_KEY }}" | awk '{gsub(/\\n/,"\n")}1' > key.pem
          {
            echo 'GOOGLE_PRIVATE_KEY<<EOF'
            cat key.pem
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Run Gemini GA4 Summary via MCP (JS server)
        id: ga4
        uses: google-gemini/gemini-cli-action@main
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ env.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID:     ${{ secrets.GA_PROPERTY_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:       gemini-2.0-flash
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          pre_run: |
            mkdir -p .gemini
            echo '{
              "mcpServers": {
                "google-analytics": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-google-analytics"],
                  "env": {
                    "GOOGLE_CLIENT_EMAIL": "'"${GOOGLE_CLIENT_EMAIL}"'",
                    "GOOGLE_PRIVATE_KEY": "'"${GOOGLE_PRIVATE_KEY//$'\n'/\\n}"'",
                    "GA_PROPERTY_ID": "'"${GA_PROPERTY_ID}"'"
                  }
                }
              },
              "coreTools": ["mcp__google-analytics__run_report"]
            }' > .gemini/settings.json
          settings_json: "{}"
          prompt: |
            あなたはGA4データアナリストです。
            GA_PROPERTY_ID のプロパティから昨日（タイムゾーンは Asia/Tokyo）から一週間のデータを取得し
            - 主なトラフィックソース（source/medium）
            - 人気ページ（pagePath 等）
            - 主なコンバージョンイベント
            - 改善点
            を日本語でまとめてください。
            例：
              ## トラフィック傾向
              ...
              ## 人気ページ
              ...
              ## コンバージョンと考察
              ...
              ## ページ改善提案
              ...
              ## 今後の施策
              ...

      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const endDate = new Date(today);
            const startDate = new Date(today);
            startDate.setDate(startDate.getDate() - 7);

            const fmt = (d) => d.toISOString().split('T')[0];
            const title = `(${fmt(today)}) らんらんアクセス解析｜期間：${fmt(startDate)}〜${fmt(endDate)}`;

            const outs = ${{ toJSON(steps.ga4.outputs) }};
            const pick = (keys) => { 
              for (const k of keys){ 
                const v=(outs?.[k]||'').trim(); 
                if(v) return v; 
              } 
              return ''; 
            };
            const body = pick(['gemini_result','gemini_response','summary','output','text','content'])
              || 'GA4集計結果が取得できませんでした。';

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
