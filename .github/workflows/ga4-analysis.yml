name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 3'  # 毎週水曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # MCPサーバーウォームアップ
      - name: Pre-install MCP server
        run: |
          npx -y mcp-server-google-analytics --version || echo "MCP server ready"
        continue-on-error: true
      
      - name: Run Gemini GA4 Summary via MCP (JS server)
        id: ga4
        uses: google-gemini/gemini-cli-action@main
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GEMINI_MODEL: gemini-2.0-flash
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          settings_json: |
            {
              "mcpServers": {
                "google-analytics": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-google-analytics"],
                  "env": {
                    "GOOGLE_CLIENT_EMAIL": "$GOOGLE_CLIENT_EMAIL",
                    "GOOGLE_PRIVATE_KEY": "$GOOGLE_PRIVATE_KEY",
                    "GA_PROPERTY_ID": "$GA_PROPERTY_ID"
                  }
                }
              },
              "coreTools": ["mcp__google-analytics__run_report"]
            }
          prompt: |
            あなたはGA4データアナリストです。
            
            【重要】必ず mcp__google-analytics__run_report ツールを使用してGA4データを取得してください。
            
            以下の手順で実行してください：
            
            1. まず run_report ツールを使って、昨日から過去7日間（タイムゾーン: Asia/Tokyo）のトラフィックソースデータを取得
               - date_ranges: 昨日から7日前まで
               - dimensions: ["sessionSource", "sessionMedium"]
               - metrics: ["sessions"]
               - order_bys: セッション数で降順
            
            2. 次に run_report ツールを使って、人気ページデータを取得
               - date_ranges: 昨日から7日前まで
               - dimensions: ["pagePath"]
               - metrics: ["screenPageViews"]
               - order_bys: ページビュー数で降順
            
            3. 最後に run_report ツールでコンバージョンイベントデータを取得
               - date_ranges: 昨日から7日前まで
               - dimensions: ["eventName"]
               - metrics: ["eventCount"]
               - dimension_filter: コンバージョンイベントに絞り込み
            
            取得したデータを以下の形式で日本語でまとめてください：
            
            ## トラフィック傾向
            （取得したトラフィックソースデータを分析）
            
            ## 人気ページ
            （取得した人気ページデータを分析）
            
            ## コンバージョンと考察
            （取得したコンバージョンデータを分析）
            
            ## ページ改善提案
            （データに基づく具体的な改善提案）
            
            ## 今後の施策
            （データに基づく今後のアクション）
      
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            // 日本時間を考慮（UTCから9時間進める）
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            
            const yesterday = new Date(jstToday);
            yesterday.setDate(yesterday.getDate() - 1);
            
            const sevenDaysAgo = new Date(jstToday);
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            // MM-DD形式に整形
            const fmt = (d) => d.toISOString().split('T')[0].slice(5); // "2025-10-22" → "10-22"
            const todayFull = jstToday.toISOString().split('T')[0]; // 実行日は西暦あり
            const title = `(${todayFull}) らんらんアクセス解析｜期間：${fmt(sevenDaysAgo)}〜${fmt(yesterday)}`;
            
            const outs = ${{ toJSON(steps.ga4.outputs) }};
            const pick = (keys) => { 
              for (const k of keys){ 
                const v=(outs?.[k]||'').trim(); 
                if(v) return v; 
              } 
              return ''; 
            };
            const body = pick(['gemini_result','gemini_response','summary','output','text','content'])
              || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
