name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. コード読み込み回避（必須）

      # 2. Node.jsセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Gemini CLI グローバルインストール
      # node_modules読み込み事故を防ぐ最強の布陣です
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業用ディレクトリの作成
      # ここで * (全ファイル) を無視設定にし、確実にクリーンな環境を作ります
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore

      # 5. 設定ファイルの作成
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. 【決定版】リッチ＆安全プロンプト
      # ページ分析(pagePath)を除外し、代わりに「地域」「デバイス」を追加。
      # これによりデータ量を爆発させずに、レポートの密度を高めます。
      - name: Create Prompt File
        run: |
          TODAY=$(date +%Y-%m-%d)
          START_THIS=$(date -d "7 days ago" +%Y-%m-%d)
          END_THIS=$(date -d "1 day ago" +%Y-%m-%d)
          START_LAST=$(date -d "14 days ago" +%Y-%m-%d)
          END_LAST=$(date -d "8 days ago" +%Y-%m-%d)

          cat <<EOF > work_dir/prompt.txt
          あなたは熟練のWebマーケティングコンサルタントです。
          以下のデータに基づき、**「比較」と「インサイト」に富んだ詳細なレポート**を作成してください。

          【分析対象期間】
          - 今週: $START_THIS から $END_THIS
          - 前週: $START_LAST から $END_LAST

          【指示：データ取得】
          mcp__google-analytics__run_report を使い、「今週」と「前週」のデータを取得・比較してください。
          **※ページ分析（pagePath）はデータ過多によりエラーになるため取得禁止です。**
          代わりに以下の「属性データ」を取得して分析を深めてください。

          1. **流入チャネル詳細**
             - dimensions: ["sessionSource", "sessionMedium"]
             - metrics: ["sessions"]
          
          2. **ユーザー属性（地域・デバイス）**
             - dimensions: ["city", "deviceCategory"]
             - metrics: ["sessions"]
             - ※「どの地域からのアクセスが増えたか」「スマホ比率はどうか」を分析します。
          
          3. **コンバージョン詳細**
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]

          【指示：分析と計算】
          1. **前週比の算出**: 
             - 主要な数値について (今週-前週)÷前週×100 で増減率を出し、「+XX%」「-XX%」と明記してください。
          
          2. **CVRとファネル**:
             - CVR = (予約完了数 ÷ 予約フォーム開始数) × 100
             - 「予約開始」から「完了」までの離脱率も計算してください。

          【出力フォーマット】
          Markdown形式で出力してください。

          ***
          # 📈 週次アクセス解析レポート ($START_THIS 〜 $END_THIS)
          
          ## 1. エグゼクティブサマリー
          - **総合評価**: (例: 良好 / 要改善)
          - **トピックス**: (今週の最も大きな変化を1行で)
          
          ## 2. コンバージョン・パフォーマンス (最重要)
          - **全体CVR**: **[XX.X%]** (前週比: ±XXポイント)
          - **ファネル詳細**:
            * 🏁 予約フォーム開始: [件数] (前週比: ±XX%)
            * 🚩 予約完了: [件数] (前週比: ±XX%)
          - **考察**: (CVRの変化要因について)
          
          ## 3. ユーザー属性と流入の変化
          - **地域別トレンド**:
            * (例: 大阪からのアクセスが急増しています等)
          - **デバイス比率**:
            * Mobile: [XX%], Desktop: [XX%]
          - **主要流入元**:
            * [ソース名]: [セッション数] (前週比: ±XX%)
          
          ## 4. 今後のアクションプラン
          - **課題**: 
          - **具体的施策**: (来週やるべきこと)
          ***
          EOF

      # 7. Geminiの実行
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          
          # Geminiを実行 (--yoloで自動承認)
          gemini -m gemini-2.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          # 結果を環境変数に格納
          echo "GEMINI_RESPONSE<<EOF" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 8. Issueの作成
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            const todayFull = jstToday.toISOString().split('T')[0];
            
            const title = `(${todayFull}) 📊 GA4詳細解析レポート`;
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
