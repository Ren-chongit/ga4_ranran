name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. 読み込み回避

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Gemini CLI グローバルインストール
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業ディレクトリ作成
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore

      # 5. 設定ファイル作成
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. 【最終安全版】チャネルグループ分析プロンプト
      # 「sessionSource」(数千件ある) をやめ、「sessionDefaultChannelGroup」(約10件しかない) に変更しました。
      # これによりデータ爆発を物理的に防ぎます。CVR計算に必要なイベントデータは維持します。
      - name: Create Prompt File
        run: |
          TODAY=$(date +%Y-%m-%d)
          START_THIS=$(date -d "7 days ago" +%Y-%m-%d)
          END_THIS=$(date -d "1 day ago" +%Y-%m-%d)
          START_LAST=$(date -d "14 days ago" +%Y-%m-%d)
          END_LAST=$(date -d "8 days ago" +%Y-%m-%d)

          cat <<EOF > work_dir/prompt.txt
          あなたはWebマーケティングコンサルタントです。
          以下のデータに基づき、コンバージョンを中心とした週次レポートを作成してください。

          【分析対象期間】
          - 今週: $START_THIS から $END_THIS
          - 前週: $START_LAST から $END_LAST

          【指示：データ取得】
          mcp__google-analytics__run_report を使い、「今週」と「前週」のデータを取得してください。
          
          ★重要：データ量を最小化するため、以下の指標のみを取得してください。
          
          1. **チャネル別トラフィック（超軽量）**
             - dimensions: ["sessionDefaultChannelGroup"]
             - metrics: ["sessions"]
             - ※「Organic Search」「Paid Search」などの大枠のトレンドを見ます。
          
          2. **イベント・コンバージョン**
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]
             - ※ここからCVRを計算します。

          【指示：分析と計算】
          1. **前週比**: 
             - (今週-前週)÷前週×100 で増減率を算出。
          
          2. **CVRとファネル**:
             - 予約開始: "booking_form_start" (または form_start 等の類似イベント)
             - 予約完了: "booking_complete" (または purchase 等の類似イベント)
             - CVR = (完了数 ÷ 開始数) × 100

          【出力フォーマット】
          Markdown形式で出力してください。

          ***
          # 📉 週次アクセス解析レポート ($START_THIS 〜 $END_THIS)
          
          ## 1. コンバージョン成果 (最重要)
          - **全体CVR**: **[XX.X%]** (前週比: ±XXpt)
          - **予約フォーム開始**: [XX件] (前週比: ±XX%)
          - **予約完了**: [XX件] (前週比: ±XX%)
          - **考察**: (数値の変化とその要因)
          
          ## 2. チャネル別トラフィック
          - **主な流入経路**:
            * [チャネル名]: [セッション数] (前週比: ±XX%)
            * ...
          - **考察**: (検索や広告など、どのチャネルが好調か)
          
          ## 3. 今後の対策
          - **アクション**: (具体的な改善案を1つ)
          ***
          EOF

      # 7. Geminiの実行
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          gemini -m gemini-2.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          echo "GEMINI_RESPONSE<<EOF" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 8. Issueの作成
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            const todayFull = jstToday.toISOString().split('T')[0];
            
            const title = `(${todayFull}) GA4チャネル別解析レポート`;
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
