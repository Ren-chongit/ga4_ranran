name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. 読み込み回避

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Gemini CLI グローバルインストール (安全対策)
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業ディレクトリ作成 (安全対策)
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore

      # 5. 設定ファイル作成
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. 【リッチ化フェーズ1】プロンプトのアップグレード
      # ・チャネルグループをやめ、「sessionSource / sessionMedium」に戻します（詳細化）
      # ・「deviceCategory（デバイス）」と「city（都市）」を追加します（多角化）
      # ・ページ分析はまだ危険なので入れません。
      - name: Create Prompt File
        run: |
          TODAY=$(date +%Y-%m-%d)
          START_THIS=$(date -d "7 days ago" +%Y-%m-%d)
          END_THIS=$(date -d "1 day ago" +%Y-%m-%d)
          START_LAST=$(date -d "14 days ago" +%Y-%m-%d)
          END_LAST=$(date -d "8 days ago" +%Y-%m-%d)

          cat <<EOF > work_dir/prompt.txt
          あなたは熟練のWebマーケティングコンサルタントです。
          以下のデータに基づき、**具体的でインサイトのある週次レポート**を作成してください。

          【分析対象期間】
          - 今週: $START_THIS から $END_THIS
          - 前週: $START_LAST から $END_LAST

          【指示：データ取得】
          mcp__google-analytics__run_report を使い、「今週」と「前週」のデータを取得してください。
          
          **取得する指標（以下の3つをそれぞれ取得すること）:**
          
          1. **詳細な流入元トラフィック**
             - dimensions: ["sessionSource", "sessionMedium"]
             - metrics: ["sessions"]
             - ※「google / cpc」や「yahoo / organic」ごとの増減を見ます。
          
          2. **ユーザー属性（デバイス・地域）**
             - dimensions: ["deviceCategory", "city"]
             - metrics: ["sessions"]
             - ※「スマホ比率」や「地域ごとのアクセス傾向」を見ます。
          
          3. **イベント・コンバージョン**
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]

          【指示：分析と計算】
          1. **前週比**: 
             - 主要な数値について (今週-前週)÷前週×100 で増減率を算出。「+XX%」「-XX%」と明記。
          
          2. **CVRとファネル**:
             - 予約開始: "booking_form_start"
             - 予約完了: "booking_complete"
             - CVR = (完了数 ÷ 開始数) × 100

          【出力フォーマット】
          Markdown形式で出力してください。

          ***
          # 📈 週次アクセス解析レポート ($START_THIS 〜 $END_THIS)
          
          ## 1. コンバージョン成果
          - **全体CVR**: **[XX.X%]** (前週比: ±XXpt)
          - **予約フォーム開始**: [XX件] (前週比: ±XX%)
          - **予約完了**: [XX件] (前週比: ±XX%)
          - **考察**: (CVRの変化要因について、流入元やデバイスの変化と絡めて考察)
          
          ## 2. 流入元詳細分析
          - **トップ流入元**:
            * [ソース/メディア]: [セッション数] (前週比: ±XX%)
            * ...
          - **考察**: (特定の広告や検索エンジンの動きについて)
          
          ## 3. ユーザー属性トレンド
          - **デバイス比率**: (Mobile vs Desktopの傾向)
          - **注目エリア**: (アクセスが増えている都市など)
          
          ## 4. 今後のアクション
          - **課題**:
          - **具体的施策**:
          ***
          EOF

      # 7. Geminiの実行
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          gemini -m gemini-2.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          echo "GEMINI_RESPONSE<<EOF" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 8. Issueの作成
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            const todayFull = jstToday.toISOString().split('T')[0];
            
            const title = `(${todayFull}) 📊 GA4詳細解析レポート`;
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
