name: Google Analytics 自動分析

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 日本時間9:00（UTC 24:00）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run Gemini GA4 Summary via MCP (JS server)
        id: ga4
        uses: google-gemini/gemini-cli-action@main
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}   # 改行ありPEMをそのまま
          GA_PROPERTY_ID:     ${{ secrets.GA_PROPERTY_ID }}       # 数字のみ
        with:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          settings_json: |
            {
              "mcpServers": {
                "google-analytics": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-google-analytics"],
                  "env": {
                    "GOOGLE_CLIENT_EMAIL": "$GOOGLE_CLIENT_EMAIL",
                    "GOOGLE_PRIVATE_KEY": "$GOOGLE_PRIVATE_KEY",
                    "GA_PROPERTY_ID": "$GA_PROPERTY_ID"
                  }
                }
              },
              "coreTools": ["mcp__google-analytics__run_report"]
            }
          prompt: |
            あなたはWebサイトのアクセス解析レポートアシスタントです。
            GA_PROPERTY_ID のプロパティについて、昨日（プロパティのタイムゾーン）を対象に、
            以下の観点でレポートを作成してください。

            1. アクセス数が増加または減少した主要トラフィックソース（source/medium）
            2. 滞在時間・直帰率などから見た「改善の余地があるページ」
            3. コンバージョン数（eventName=conversion または purchase）とその増減要因（デバイス・参照元・地域など）
            4. 全体の傾向を簡潔にまとめ、改善提案を3点以内で示してください。

            可能であれば前日比・先週同曜日比の変化もコメントしてください。
            出力は日本語で、見やすい箇条書きレポート形式で。

      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date().toISOString().split('T')[0];
            const outs = ${{ toJSON(steps.ga4.outputs) }};
            const pick = (keys) => { for (const k of keys){ const v=(outs?.[k]||'').trim(); if(v) return v; } return ''; };
            const body = pick(['gemini_result','gemini_response','summary','output','text','content'])
              || 'GA4集計結果が取得できませんでした。';
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `GA4サマリー (${today})`,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
