name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. リポジトリ読み込み回避
      
      # 2. Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Gemini CLIをグローバルインストール（必須）
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業用ディレクトリの作成
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore

      # 5. 設定ファイルの作成
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. 【復活】リッチレポート用プロンプト
      # 以前のような詳細な分析を行うための指示に戻しました。
      # ★重要：limitパラメータを「引数オブジェクトの中」に入れるよう指示し、ページデータも安全に取得します。
      - name: Create Prompt File
        run: |
          TODAY=$(date +%Y-%m-%d)
          START_THIS=$(date -d "7 days ago" +%Y-%m-%d)
          END_THIS=$(date -d "1 day ago" +%Y-%m-%d)
          START_LAST=$(date -d "14 days ago" +%Y-%m-%d)
          END_LAST=$(date -d "8 days ago" +%Y-%m-%d)

          cat <<EOF > work_dir/prompt.txt
          あなたはプロのWebマーケティングコンサルタントです。
          以前のような**「詳細でインサイトに富んだレポート」**を作成してください。
          
          【分析対象期間】
          - 今週: $START_THIS から $END_THIS
          - 前週: $START_LAST から $END_LAST

          【指示：データ取得（重要）】
          mcp__google-analytics__run_report ツールを使用してください。
          **「今週」と「前週」の2回データを取得し、比較してください。**
          
          ★APIエラー回避のコツ：
          `limit` 引数はトップレベルではなく、**設定オブジェクトの内部プロパティ**として渡してください。
          （例: { dateRanges: [...], metrics: [...], limit: 20 } ）

          以下の3種類のデータを取得すること（それぞれ limit: 20 を適用）：

          1. **詳細トラフィック**
             - dimensions: ["sessionSource", "sessionMedium"]
             - metrics: ["sessions"]
          
          2. **人気ページランキング**
             - dimensions: ["pagePath"]
             - metrics: ["screenPageViews"]
             - ※limit: 20 を適用すればエラーになりません。必ず取得してください。
          
          3. **イベント・コンバージョン（全件）**
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]
             - limit: 100

          【指示：分析と計算】
          1. **前週比の算出**: 
             - すべての主要指標について (今週-前週)÷前週×100 で増減率を出してください。
          
          2. **ファネル分析（詳細）**:
             - 以下のイベントフローの「件数」と「通過率(遷移率)」を計算してください。
             - Flow: `booking_form_start` (開始) → `booking_form_step2` (入力中) → `booking_complete` (完了)
             - ※イベント名が異なる場合は、似たものを探して推測してください。

          【出力フォーマット】
          以前のレポート形式（Markdown）を再現してください。

          ***
          # 📊 らんらんアクセス解析 ($START_THIS 〜 $END_THIS)
          
          ## 1. トラフィック傾向
          - **分析期間**: 今週 vs 前週
          - **上位ソース**:
            * [ソース/メディア]: [セッション数] [前週比±XX%]
            * ...
          - **考察**: (cpcやorganicの変化について具体的に)
          - **改善提案**: (具体的なアクション)
          
          ## 2. 人気ページ
          - **上位ページ**:
            * [パス]: [PV数] [前週比±XX%]
            * ...
          - **考察**: (どのツアーや特集が見られているか)
          
          ## 3. コンバージョンと考察 (最重要)
          - **全体CVR**: [XX%] [前週比]
          - **ファネル詳細**:
            * 予約開始: [件数] [前週比]
            * Step2遷移: [件数] (離脱率: XX%)
            * 予約完了: [件数] (Step2からの離脱率: XX%)
          - **改善提案**: (離脱ポイントに対する具体的な施策)
          
          ## 4. 週次サマリー
          - **総合評価**:
          - **特記事項**:
          - **今後の施策**: (優先度順)
          ***
          EOF

      # 7. Geminiの実行
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          
          # Geminiを実行 (--yoloで自動承認)
          gemini -m gemini-2.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          # 結果を環境変数に格納
          echo "GEMINI_RESPONSE<<EOF" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 8. Issueの作成
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            const todayFull = jstToday.toISOString().split('T')[0];
            
            const title = `(${todayFull}) 詳細アクセス解析レポート`;
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
