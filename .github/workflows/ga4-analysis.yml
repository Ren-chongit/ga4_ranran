name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. リポジトリ読み込み回避（トークン対策の基本）

      # 2. Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Gemini CLIをグローバルインストール
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業用ディレクトリの作成と保護
      # ここで「全てのファイルを無視(.geminiignore)」設定を行い、
      # ツールが生成する一時ファイルなどをAIが読み込んで自爆するのを防ぎます。
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore
          echo "Created .geminiignore to ignore ALL files in context."

      # 5. 設定ファイルの作成（~/.gemini/settings.json）
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. プロンプト（指示書）の作成
      # 【重要】データ爆発の原因となる「pagePath」の取得を削除しました。
      # これでデータ量が劇的に減り、Quotaエラーを回避できます。
      - name: Create Prompt File
        run: |
          cat <<EOF > work_dir/prompt.txt
          あなたはプロのGA4データアナリストです。
          
          【重要】
          1. dimensionFilter（フィルタ機能）は使用禁止です。
          2. limit（件数制限）の指定も不要です。
          
          【手順1：データの取得】
          以下のデータを mcp__google-analytics__run_report ツールで取得してください。
          ※データ量を抑えるため、**ページ分析（pagePath）は行わないでください。**
          
          1. **イベントデータ（今週）**
             - 期間：昨日から過去7日間
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]
          
          2. **流入元データ（今週）**
             - dimensions: ["sessionSource"]
             - metrics: ["sessions"]
          
          【手順2：計算と分析】
          取得したデータから以下を計算し、レポートを作成してください。
          
          - 予約フォーム開始数 (booking_form_start 等。なければ似たイベントを探す)
          - 予約完了数 (booking_complete 等)
          - CVR = (完了数 ÷ 開始数) × 100
          
          【出力形式】
          Markdown形式で、GitHub Issueにそのまま貼れる形式で出力してください。
          
          ## 📊 アクセス解析レポート (MM/DD - MM/DD)
          
          ### 1. 概要
          - **トップ流入元**: (上位のソースを記載)
          
          ### 2. コンバージョン分析
          - **予約フォーム開始**: XX件
          - **予約完了**: XX件
          - **CVR**: XX.X%
          - **考察**: (数値に基づく短いコメント)
          EOF

      # 7. Geminiの実行
      # work_dir に移動してから実行することで、クリーンな環境を保ちます
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          
          # Geminiを実行 (--yoloで自動承認)
          gemini -m gemini-2.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          # 結果を環境変数に格納
          echo "GEMINI_RESPONSE<<EOF" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 8. Issueの作成
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            
            const yesterday = new Date(jstToday);
            yesterday.setDate(yesterday.getDate() - 1);
            
            const sevenDaysAgo = new Date(jstToday);
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            const fmt = (d) => d.toISOString().split('T')[0].slice(5);
            const todayFull = jstToday.toISOString().split('T')[0];
            const title = `(${todayFull}) らんらんアクセス解析｜期間：${fmt(sevenDaysAgo)}〜${fmt(yesterday)}`;
            
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
