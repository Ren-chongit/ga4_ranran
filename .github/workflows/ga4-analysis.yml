name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. リポジトリ読み込み回避

      # 2. Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Gemini CLIをグローバルインストール
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業用ディレクトリの作成
      # 以前の失敗（node_modules読み込み）をここで完全に防ぎます
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore

      # 5. 設定ファイルの作成
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. プロンプト作成（安全対策済み）
      # 「Top 20」という言葉を使うことで、AIが内部的にうまくデータを絞ってくれるよう誘導します。
      # ツール側のlimit引数が使えなくても、AIへの指示でデータ量を制御します。
      - name: Create Prompt File
        run: |
          TODAY=$(date +%Y-%m-%d)
          START_THIS=$(date -d "7 days ago" +%Y-%m-%d)
          END_THIS=$(date -d "1 day ago" +%Y-%m-%d)
          START_LAST=$(date -d "14 days ago" +%Y-%m-%d)
          END_LAST=$(date -d "8 days ago" +%Y-%m-%d)

          cat <<EOF > work_dir/prompt.txt
          あなたはプロのWebマーケティングコンサルタントです。
          クライアントのために、要点を絞ったGA4アクセス解析レポートを作成してください。

          【分析対象期間】
          - 今週: $START_THIS から $END_THIS
          - 前週: $START_LAST から $END_LAST

          【重要：トークン超過を防ぐための制約】
          データ取得の際は、**「上位の主要なデータのみ」**を取得し、決して全データを取得しないでください。
          各項目につき **「最大20行程度」** のデータがあれば十分です。

          【指示：データ取得と分析】
          mcp__google-analytics__run_report ツールを使い、「今週」と「前週」のデータを取得・比較してください。

          1. **トラフィック分析 (Top 20)**
             - dimensions: ["sessionSource"]
             - metrics: ["sessions"]
             - 主要な流入元の増減を確認してください。

          2. **人気ページ分析 (Top 20)**
             - dimensions: ["pagePath"]
             - metrics: ["screenPageViews"]
             - ※全ページではなく、アクセスの多い上位ページのみに注目してください。

          3. **コンバージョン分析**
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]
             - 以下のイベントを探して計算してください：
               - 予約開始 (booking_form_start 等)
               - 予約完了 (booking_complete 等)
             - CVR = (完了数 ÷ 開始数) × 100

          【出力フォーマット】
          Markdown形式で出力してください。

          ***
          # 📊 アクセス解析レポート ($START_THIS - $END_THIS)
          
          ## 1. トラフィックと人気ページ
          - **主要な流入元**:
            * [ソース名]: [セッション数] (前週比: 考察)
          - **人気ページ**:
            * [パス]: [PV数] (前週比: 考察)
          
          ## 2. コンバージョン成果
          - **予約フォーム開始**: [件数] (前週比)
          - **予約完了**: [件数] (前週比)
          - **CVR**: [XX%] (前週比)
          
          ## 3. まとめと改善提案
          - **総評**:
          - **具体的な改善アクション**:
          ***
          EOF

      # 7. Geminiの実行
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          
          # Geminiを実行 (--yoloで自動承認)
          gemini -m gemini-2.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          # 結果を環境変数に格納
          echo "GEMINI_RESPONSE<<EOF" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 8. Issueの作成
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            const todayFull = jstToday.toISOString().split('T')[0];
            
            const title = `(${todayFull}) GA4アクセス解析レポート`;
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
