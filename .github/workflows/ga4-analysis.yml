name: Gemini GA4 Summary
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 日本時間09:00（UTC 00:00）
permissions:
  contents: read
  issues: write
jobs:
  summarize-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. リポジトリ読み込み回避（トークン対策）

      # 2. Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Gemini CLIをグローバルインストール
      - name: Install Gemini CLI Globally
        run: npm install -g @google/gemini-cli

      # 4. 作業用ディレクトリの作成（必須）
      - name: Prepare Clean Workspace
        run: |
          mkdir -p work_dir
          cd work_dir
          echo "*" > .geminiignore

      # 5. 設定ファイルの作成
      - name: Configure Gemini Settings
        run: |
          mkdir -p ~/.gemini
          cat <<EOF > ~/.gemini/settings.json
          {
            "mcpServers": {
              "google-analytics": {
                "command": "npx",
                "args": ["-y", "mcp-server-google-analytics"]
              }
            },
            "coreTools": ["mcp__google-analytics__run_report"]
          }
          EOF

      # 6. プロンプト作成（データ量削減版）
      # 【重要】データ爆発の原因となる「pagePath（ページ分析）」を削除しました。
      # イベントデータ（CVR）と流入元だけに絞ることで、確実に制限内に収めます。
      - name: Create Prompt File
        run: |
          TODAY=$(date +%Y-%m-%d)
          START_THIS=$(date -d "7 days ago" +%Y-%m-%d)
          END_THIS=$(date -d "1 day ago" +%Y-%m-%d)
          START_LAST=$(date -d "14 days ago" +%Y-%m-%d)
          END_LAST=$(date -d "8 days ago" +%Y-%m-%d)

          cat <<EOF > work_dir/prompt.txt
          あなたはプロのWebマーケティングコンサルタントです。
          クライアントのために、**コンバージョン分析を中心とした**GA4レポートを作成してください。

          【分析対象期間】
          - 今週: $START_THIS から $END_THIS
          - 前週: $START_LAST から $END_LAST

          【指示：データ取得】
          mcp__google-analytics__run_report ツールを使い、「今週」と「前週」のデータを取得してください。
          ※データ量を抑えるため、以下の項目のみを取得すること。

          1. **トラフィック流入元**
             - dimensions: ["sessionSource"]
             - metrics: ["sessions"]
             - ※主要な流入元の変化を見ます。

          2. **コンバージョン（イベント）**
             - dimensions: ["eventName"]
             - metrics: ["eventCount"]
             - ※ここから予約数などを計算します。
             
          **【重要】「pagePath（ページ別データ）」は絶対に取得しないでください。データ量が多すぎてエラーになります。**

          【指示：分析と計算】
          取得したデータを比較し、以下を算出してください。

          1. **コンバージョン率(CVR)**
             - 「booking_form_start（予約開始）」と「booking_complete（予約完了）」を探す。
             - なければ似たイベント名（例: form_start, purchase等）を使用。
             - CVR = (予約完了数 ÷ 予約開始数) × 100
             - 前週との比較も行うこと。

          【出力フォーマット】
          Markdown形式で出力してください。

          ***
          # 📊 週間アクセス解析レポート ($START_THIS - $END_THIS)
          
          ## 1. コンバージョン成果 (最重要)
          - **全体CVR**: [XX%] (前週比: ±XXポイント)
          - **予約フォーム開始**: [XX件] (前週比: ±XX%)
          - **予約完了**: [XX件] (前週比: ±XX%)
          - **ファネル分析**: (完了率や離脱率についてのコメント)
          
          ## 2. トラフィック傾向
          - **トップ流入元**: 
            * [ソース名]: [セッション数] (前週比)
          - **考察**: (流入元の変化とCVRへの影響について)
          
          ## 3. まとめと次週のアクション
          - **状況**: (良好/横ばい/低下)
          - **アクション**: (具体的な改善案を1つ)
          ***
          EOF

      # 7. Geminiの実行
      - name: Run Gemini
        id: gemini_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          cd work_dir
          
          # Geminiを実行 (--yoloで自動承認)
          gemini -m gemini-2.5-flash --yolo "$(cat prompt.txt)" > result.md
          
          # 結果を環境変数に格納
          echo "GEMINI_RESPONSE<<EOF" >> $GITHUB_ENV
          cat result.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 8. Issueの作成
      - name: Create GitHub Issue with Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }} 
          script: |
            const today = new Date();
            const jstOffset = 9 * 60 * 60 * 1000;
            const jstToday = new Date(today.getTime() + jstOffset);
            const todayFull = jstToday.toISOString().split('T')[0];
            
            const title = `(${todayFull}) GA4コンバージョン解析レポート`;
            const body = process.env.GEMINI_RESPONSE || 'GA4集計結果が取得できませんでした。';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body
            });
            core.info(`✅ Issue #${issue.number} を作成しました`);
